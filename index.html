const icons=[['电话','☎','#55ca6b','phoneapp'],['KakaoTalk','TALK','#ffe43b','kakao'],['X','𝕏','#070707','x'],['Instagram','◎','linear-gradient(135deg,#f9c74f,#e23e7d,#6846c6)','instagram'],['Spotify','≋','#1db954','spotify'],['YouTube','▶','#ed333b',null],['相册','✿','#f8f8f8',null],['备忘录','▤','#f3d55d',null],['地图','◈','#b5d9e8',null],['设置','⚙','#858b94',null],['信息','●','#50d868',null],['相机','▣','#a5a9af',null]];function iconHTML(i,dock=false){let [name,glyph,bg,target]=i;return `<button class="appicon" ${target?`data-go="${target}"`:''}><span class="ico" style="background:${bg};color:${['KakaoTalk','Spotify','相册','备忘录'].includes(name)?'#161616':'white'};font-size:${glyph==='TALK'?'13':'30'}px">${glyph}</span>${dock?'':`<span>${name}</span>`}</button>`}$('apps').innerHTML=icons.slice(0,10).map(i=>iconHTML(i)).join('');$('dock').innerHTML=[icons[0],icons[1],icons[10],icons[11]].map(i=>iconHTML(i,true)).join('');document.querySelectorAll('[data-go]').forEach(x=>x.addEventListener('click',()=>go(x.dataset.go)));
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))} $('calls').innerHTML=CONFIG.calls.map(g=>`<div class="section">${esc(g.group)}</div>${g.items.map(i=>`<div class="callrow"><div style="flex:1"><b style="color:${i.type==='未接'?'#e64646':'inherit'}">${esc(i.name||CONFIG.contactName)} ${esc(i.count)}</b><div class="muted">${i.type==='发'?'↗ 已拨电话':i.type==='收'?'↙ 已接来电':'↙ 未接来电'}</div></div><div class="meta">${esc(i.time)}　ⓘ</div></div>`).join('')}`).join('');$('myname').textContent=CONFIG.userName;let friends=[CONFIG.contactName,'智恩','金泳勋','许延','妈妈','公司企划组'];$('friendcount').textContent=friends.length;$('friends').innerHTML=friends.map((n,i)=>`<div class="friend" data-friend="${esc(n)}"><div class="avatar" style="background:${['#a0a1bd','#d2b6a9','#6d8b9d','#91a7a3'][i%4]}">${esc(n.slice(0,1))}</div><div>${esc(n)}<div class="muted">${i===0?'오늘도 보고 싶어 🤍':i===1?'周末吃烤肉！':' '}</div></div><div class="meta">›</div></div>`).join('');document.querySelectorAll('[data-friend]').forEach(el=>el.onclick=()=>{selectedFriend=el.dataset.friend;go('chat')});function renderChat(){ $('chatname').textContent=selectedFriend;let relevant=CONFIG.chat.filter(m=>{let names=['智恩','同事','道勋','金泳勋','许延'];let prefix=names.find(n=>m.text.startsWith(n+'：'));return !prefix||selectedFriend.includes(prefix)||prefix==='道勋'&&selectedFriend===CONFIG.contactName});$('messages').innerHTML=relevant.map((m,i)=>`<div class="message-row ${/^(智恩|同事|道勋|金泳勋|许延)：/.test(m.text)?'other':''}"><span class="stamp">${esc(m.time)} ${i%3===0?'1':''}</span><div class="bubble">${esc(m.text.replace(/^(智恩|同事|道勋|金泳勋|许延)：/,''))}</div></div>`).join('');$('chat').scrollTop=$('chat').scrollHeight}function sendChat(e){e.preventDefault();let v=$('chattext').value.trim();if(!v)return;let now=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});CONFIG.chat.push({time:now,text:v});$('chattext').value='';renderChat()}
$('handle').textContent=CONFIG.twitterHandle;$('tweets').innerHTML=CONFIG.tweets.map((t,i)=>`<div class="tweet"><div class="avatar" style="width:40px;height:40px;border-radius:50%">尤</div><div class="body"><b>${esc(CONFIG.userName)} 🔒</b> <span class="tweetmeta">${esc(CONFIG.twitterHandle)} · ${i+1}天前</span><p>${esc(t)}</p><div class="tweetactions"><span>♡ ${3+i*2}</span><span>↻ ${i%3}</span><span>♧ ${10+i*3}</span><span>↗</span></div></div></div>`).join('');
$('callername').textContent=CONFIG.instagram.callerName;$('videoname').textContent=CONFIG.instagram.callerName;$('calleravatar').innerHTML=CONFIG.instagram.avatar?`<img src="${esc(CONFIG.instagram.avatar)}" alt="">`:esc(CONFIG.instagram.callerName.slice(0,1));function clearCall(){clearInterval(callInterval);callTimeouts.forEach(clearTimeout);callTimeouts=[];$('mainvideo').pause();$('selfvideo').pause()}function resetIncoming(){clearCall();$('incoming').style.display='flex';$('videoarea').style.display='none';$('floatmsgs').innerHTML='';seconds=0;$('calltimer').textContent='00:00'}function endCall(){clearCall();go('home')}function format(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}function answerCall(){$('incoming').style.display='none';$('videoarea').style.display='block';let a=$('mainvideo'),b=$('selfvideo');a.src=CONFIG.instagram.video;b.src=CONFIG.instagram.selfVideo||'';a.play().catch(()=>{});if(b.src)b.play().catch(()=>{});seconds=0;callInterval=setInterval(()=>{$('calltimer').textContent=format(++seconds).padStart(5,'0')},1000);let cumulative=0;CONFIG.instagram.messages.forEach(m=>{cumulative+=Number(m.delay)||3;callTimeouts.push(setTimeout(()=>addFloat(m.from,m.text),cumulative*1000))})}function addFloat(from,txt){let d=document.createElement('div');d.className='floatmsg';d.textContent=(from==='我'?'我':CONFIG.instagram.callerName)+'：'+txt;$('floatmsgs').appendChild(d);setTimeout(()=>d.remove(),5200)}function sendVid(e){e.preventDefault();let v=$('vidtext').value.trim();if(v){addFloat('我',v);$('vidtext').value=''}}$('videoarea').addEventListener('click',()=>{let v=$('mainvideo');if(v.muted){v.muted=false;v.play().catch(()=>{})}});let muted=true,cam=true;function toggleMic(){muted=!muted;$('micbtn').style.opacity=muted?'.5':'1'}function toggleCam(){cam=!cam;$('selfvideo').style.visibility=cam?'visible':'hidden';$('cambtn').style.opacity=cam?'1':'.5'}function flipCam(){let a=$('mainvideo'),b=$('selfvideo'),s=a.src;a.src=b.src;b.src=s;a.play().catch(()=>{});b.play().catch(()=>{})}let pip=$('pip'),drag=null;pip.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,l:pip.offsetLeft,t:pip.offsetTop};pip.setPointerCapture(e.pointerId)});pip.addEventListener('pointermove',e=>{if(!drag)return;pip.style.left=Math.max(0,Math.min(innerWidth-112,drag.l+e.clientX-drag.x))+'px';pip.style.top=Math.max(0,Math.min(innerHeight-165,drag.t+e.clientY-drag.y))+'px';pip.style.right='auto'});pip.addEventListener('pointerup',()=>drag=null);
$('playlist').textContent=CONFIG.spotify.playlistName;$('creator').textContent=CONFIG.spotify.creator+' · '+songs.length+'首歌曲';function coverHTML(){return CONFIG.spotify.cover?`<img src="${esc(CONFIG.spotify.cover)}">`:'♫'}$('cover').innerHTML=coverHTML();$('playercover').innerHTML=coverHTML();const audio=$('audio');function renderSongs(){$('songs').innerHTML=songs.map((s,i)=>`<div class="song" data-track="${i}"><div style="width:16px;color:#1db954">${i===track&&playing?'▥':''}</div><div><div class="name" style="color:${i===track&&playing?'#1db954':'#fff'}">${esc(s.title)}</div><div class="artist">${esc(s.artist)}</div></div><span class="more">•••</span></div>`).join('');document.querySelectorAll('[data-track]').forEach(el=>el.onclick=()=>chooseSong(+el.dataset.track))}renderSongs();function chooseSong(i){track=i;position=0;playing=true;audio.pause();audio.removeAttribute('src');if(songs[track].audio){audio.src=songs[track].audio;audio.play().catch(()=>{})}updatePlayer();renderSongs()}function updatePlayer(){let s=songs[track];$('mini').style.display='flex';$('minititle').textContent=s.title;$('miniartist').textContent=s.artist;$('playertitle').textContent=s.title;$('playerartist').textContent=s.artist;$('miniplay').textContent=playing?'Ⅱ':'▶';$('bigplay').textContent=playing?'Ⅱ':'▶';$('seek').max=audio.src&&Number.isFinite(audio.duration)?audio.duration:210;$('seek').value=position;$('elapsed').textContent=format(Math.floor(position));$('duration').textContent=format(Math.floor(+$('seek').max));$('minifill').style.width=(position/+$('seek').max*100)+'%'}function togglePlay(){if($('mini').style.display==='none'||!$('mini').style.display){chooseSong(track);return}playing=!playing;if(audio.src){playing?audio.play().catch(()=>{}):audio.pause()}updatePlayer();renderSongs()}function openPlayer(){$('player').style.display='block';updatePlayer()}function closePlayer(){$('player').style.display='none'}function nextSong(){chooseSong(shuffle?Math.floor(Math.random()*songs.length):(track+1)%songs.length)}function prevSong(){chooseSong((track-1+songs.length)%songs.length)}function shufflePlay(){shuffle=!shuffle;nextSong()}function toggleRepeat(){repeat=!repeat;$('repeatbtn').style.color=repeat?'#1db954':'#ddd'}function seekTo(v){position=+v;if(audio.src&&Number.isFinite(audio.duration))audio.currentTime=position;updatePlayer()}setInterval(()=>{if(!playing)return;if(audio.src&&Number.isFinite(audio.duration))position=audio.currentTime;else position++;if(position>=+$('seek').max){if(repeat)seekTo(0);else nextSong()}else updatePlayer()},1000);audio.onended=()=>repeat?seekTo(0):nextSong();function sharePlaylist(){if(navigator.share)navigator.share({title:CONFIG.spotify.playlistName}).catch(()=>{});else alert('歌单：'+CONFIG.spotify.playlistName)}
